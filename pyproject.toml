[build-system]
requires = ["setuptools>=68,<80"]
build-backend = "setuptools.build_meta"

[project]
name = "vln-navida-deploy"
version = "0.1.0"
description = "Deployment scaffold for NaVIDA on Jetson with remote inference"
requires-python = ">=3.9"

[project.optional-dependencies]
dev = [
  "opencv-python-headless",
  "pytest>=8",
]
server = [
  "accelerate",
  "bitsandbytes",
  "pillow",
  "qwen_vl_utils",
  "torch",
  "transformers",
]
jetson = [
  "opencv-python",
]

[tool.setuptools]
packages = ["navida_deploy"]
