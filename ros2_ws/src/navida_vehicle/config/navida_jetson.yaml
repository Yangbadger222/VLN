navida_camera_publisher:
  ros__parameters:
    camera_device: auto
    image_topic: /navida/camera/image_raw
    frame_id: navida_camera
    width: 640
    height: 480
    fps: 10.0

navida_remote_controller:
  ros__parameters:
    image_topic: /navida/camera/image_raw
    cmd_vel_topic: /cmd_vel
    inference_url: http://REMOTE_INFERENCE_HOST:50051/v1/infer
    inference_timeout_s: 20.0
    instruction: Navigate safely with the front camera.
    target_label: ""
    forward_speed: 0.15
    turn_speed: 0.35
    step_duration_s: 0.35
    max_linear_x: 0.2
    max_angular_z: 0.45
    command_timeout_s: 0.5
    min_inference_period_s: 0.5
    visual_servo_enabled: true
    target_forward_speed: 0.1
    target_turn_gain: 0.8
    target_max_angular_z: 0.25
    target_center_deadband: 0.1
    target_stop_area: 0.3
    target_min_confidence: 0.2

serial_twistctl_node:
  ros__parameters:
    port: /dev/serial_twistctl
    baudrate: 115200
    send_attempts: 1
    delay_between_attempts_ms: 0
    angular_z_scale: 1.0
